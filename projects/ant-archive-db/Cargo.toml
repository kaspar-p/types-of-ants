[package]
name = "ant-archive-db"
version = "1.0.0"
edition = "2021"

[dependencies]
ant-library = { version = "1.0.0", path = "../ant-library" }
anyhow = "1.0.99"
async-trait = "0.1"
bb8 = "0.9"
chrono = "0.4.45"
stdext = "0.3.3"
thiserror = "2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tracing = { version = "0.1.41", features = ["max_level_debug"] }
